<body class="bg-surface text-on-surface font-body-sm min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim shadow-sm fixed top-0 w-full z-40">
<div class="flex items-center justify-between px-md h-16 w-full max-w-container-max mx-auto">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-primary dark:text-primary-fixed-dim">Receipt Details</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">share</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="pt-24 px-md md:px-lg max-w-2xl mx-auto flex flex-col gap-xl">
<!-- Header Section -->
<section class="text-center md:text-left flex flex-col gap-sm">
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface">Samsung Mobile</h2>
<div class="flex items-center justify-center md:justify-start gap-sm">
<span class="bg-tertiary-container/20 text-tertiary-container font-label-caps text-label-caps px-3 py-1 rounded-full border border-tertiary-container/30">120 days left</span>
</div>
</section>
<!-- Receipt Image Preview Placeholder -->
<section class="w-full aspect-[4/3] md:aspect-video rounded-xl overflow-hidden shadow-sm border border-surface-variant relative group bg-surface-container flex items-center justify-center">
<img class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 opacity-80 mix-blend-multiply" data-alt="A clean, minimalist flat-lay photograph of a crisp, white retail receipt from Best Buy resting on a subtle, light-grey marble surface. The lighting is bright and even, casting very soft shadows to emphasize a modern, professional, and organized aesthetic typical of high-end digital archiving. The focus is sharp on the top portion of the receipt where 'Samsung Mobile' and the $899.00 price tag would logically be, though text is abstract. A slight cool-blue tint permeates the ambient light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgetbekP5lrcviDP41gY55MZFHtb8FRGRDcjR0Z8aT7EOo4nUR192R3h0qrB-BLnnFE0MtE0gc-suQZAGNXCKMJ_45D1RoGdmHAcvQWrBfhmcrhfMao9B6U3GPBZVfKfF0NGzA2zzP_1jlfIh3O_vl4NPLQh1a0PKKxx1rdk2-o6V8_mGSGyCdtkLsgkKQ5VduIf-_2uW0-mi8Oq8QE0pUf39IJBQBXJ_NLO1OQCyvRl3BY6qKFuARld9n7ozzjHos18XqHDCSPRer"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-highest/80 to-transparent flex items-end p-md">
<button class="bg-surface text-on-surface font-label-caps text-label-caps px-4 py-2 rounded-full shadow-sm hover:shadow-md transition-shadow flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">fullscreen</span>
                    View Full Receipt
                </button>
</div>
</section>
<!-- Details Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0px_2px_4px_rgba(0,0,0,0.05)] border border-surface-variant p-lg flex flex-col gap-lg hover:shadow-[0px_4px_8px_rgba(0,0,0,0.08)] hover:border-outline-variant transition-all duration-300">
<div class="flex justify-between items-baseline border-b border-surface-variant pb-md">
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-secondary">Store</span>
<span class="font-body-lg text-body-lg text-on-surface">Best Buy</span>
</div>
<div class="flex flex-col gap-xs text-right">
<span class="font-label-caps text-label-caps text-secondary">Price</span>
<span class="font-headline-md text-headline-md text-primary">$899.00</span>
</div>
</div>
<div class="grid grid-cols-2 gap-md md:gap-lg">
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">calendar_today</span>
                        Purchase Date
                    </span>
<span class="font-body-lg text-body-lg text-on-surface">October 15, 2023</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">timer</span>
                        Warranty Duration
                    </span>
<span class="font-body-lg text-body-lg text-on-surface">1 Year</span>
</div>
<div class="flex flex-col gap-xs col-span-2 md:col-span-1">
<span class="font-label-caps text-label-caps text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">event_busy</span>
                        Expiry Date
                    </span>
<span class="font-body-lg text-body-lg text-on-surface">October 15, 2024</span>
</div>
</div>
<!-- Progress Bar for Warranty -->
<div class="flex flex-col gap-sm pt-sm">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-secondary">Warranty Progress</span>
<span class="font-label-caps text-label-caps text-tertiary-container">Active</span>
</div>
<div class="h-1 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-tertiary-container rounded-full" style="width: 66%;"></div>
</div>
</div>
</section>
<!-- Actions -->
<section class="flex flex-col md:flex-row gap-md pt-md">
<button class="flex-1 bg-surface-container-lowest border border-outline text-secondary font-label-caps text-label-caps py-3 rounded-full hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2 active:scale-95">
<span class="material-symbols-outlined text-[18px]">edit</span>
                Edit Details
            </button>
<button class="flex-1 bg-error-container text-on-error-container font-label-caps text-label-caps py-3 rounded-full hover:bg-error hover:text-on-error transition-colors flex items-center justify-center gap-2 active:scale-95">
<span class="material-symbols-outlined text-[18px]">delete</span>
                Delete Receipt
            </button>
</section>
</main>
<!-- BottomNavBar (Hidden on MD up as per rules, though this is a detail page so it might be suppressed entirely based on semantic logic, but rules say to render if it's a top-level destination. A detail page usually isn't, but instructions provided the BottomNavBar JSON. I will suppress it based on "Linear/Transactional or Task-Focused: Any sub-page featuring a 'Close' or 'Back' action that implies a temporary departure from the main navigation flow." - The TopAppBar has a back button, so Nav shell is suppressed.) -->
</body></html>
