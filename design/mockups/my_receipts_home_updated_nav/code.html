<!DOCTYPE html>

<style>
        /* Ambient shadows and transitions */
        .ambient-shadow { box-shadow: 0px 2px 4px rgba(0,0,0,0.05); }
        .hover-lift:hover { 
            box-shadow: 0px 4px 12px rgba(0,0,0,0.08); 
            transform: translateY(-1px); 
            border-color: #E2E8F0;
        }
        .transition-all-200 { transition: all 0.2s ease-in-out; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-lg h-full flex flex-col items-center">
<div class="w-full max-w-container-max flex flex-col min-h-screen relative pb-[80px] md:pb-0 md:pt-[64px]">
<!-- TopAppBar (Hidden on desktop, visible on mobile) -->
<header class="w-full top-0 sticky shadow-sm bg-surface dark:bg-surface-dim z-40 md:hidden flex items-center justify-between px-md py-sm w-full transition-colors duration-200 hover:bg-surface-container-high dark:hover:bg-on-surface-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">receipt_long</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">My Receipts</h1>
</div>
<button class="p-sm text-on-surface-variant dark:text-outline rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full px-gutter md:px-lg py-md flex flex-col gap-lg">
<!-- Header for Desktop -->
<div class="hidden md:flex items-center justify-between mb-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-display-lg" style="font-variation-settings: 'FILL' 0;">receipt_long</span>
<h1 class="font-display-lg text-display-lg text-primary">My Receipts</h1>
</div>
<!-- Desktop Nav Tabs -->
<div class="flex items-center gap-md">
<button class="px-lg py-sm rounded-full bg-secondary-container text-on-secondary-container font-label-caps text-label-caps">Receipts</button>
<button class="px-lg py-sm rounded-full text-secondary hover:bg-surface-variant font-label-caps text-label-caps transition-colors">Settings</button>
</div>
</div>
<!-- Search Bar -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-md top-1/2 transform -translate-y-1/2 text-outline">search</span>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all-200" placeholder="Search receipts, items, or stores..." type="text"/>
</div>
<!-- Filter Chips -->
<div class="flex items-center gap-sm overflow-x-auto pb-xs scrollbar-hide">
<button class="px-md py-xs rounded-full bg-primary-container text-on-primary font-body-sm whitespace-nowrap transition-colors">All</button>
<button class="px-md py-xs rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-body-sm whitespace-nowrap hover:bg-surface-container-high transition-colors">Electronics</button>
<button class="px-md py-xs rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-body-sm whitespace-nowrap hover:bg-surface-container-high transition-colors">Food</button>
<button class="px-md py-xs rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-body-sm whitespace-nowrap hover:bg-surface-container-high transition-colors">Others</button>
</div>
<!-- Receipt List -->
<div class="flex flex-col gap-md">
<!-- Card 1 -->
<div class="bg-surface-container-lowest rounded-lg border border-[#F1F5F9] ambient-shadow hover-lift transition-all-200 p-md flex items-center justify-between cursor-pointer">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">smartphone</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">Samsung Mobile</span>
<span class="font-body-sm text-body-sm text-outline">Best Buy</span>
</div>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-headline-md text-headline-md text-on-surface">$899</span>
<div class="flex items-center gap-xs px-2 py-1 rounded-full bg-tertiary-container/10">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label-caps text-label-caps text-tertiary">120 days left</span>
</div>
</div>
</div>
<!-- Card 2 -->
<div class="bg-surface-container-lowest rounded-lg border border-[#F1F5F9] ambient-shadow hover-lift transition-all-200 p-md flex items-center justify-between cursor-pointer">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">laptop_mac</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">HP Laptop</span>
<span class="font-body-sm text-body-sm text-outline">Amazon</span>
</div>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-headline-md text-headline-md text-on-surface">$1,200</span>
<div class="flex items-center gap-xs px-2 py-1 rounded-full bg-tertiary-container/10">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label-caps text-label-caps text-tertiary">2 years left</span>
</div>
</div>
</div>
<!-- Card 3 -->
<div class="bg-surface-container-lowest rounded-lg border border-[#F1F5F9] ambient-shadow hover-lift transition-all-200 p-md flex items-center justify-between cursor-pointer">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">coffee_maker</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">Coffee Maker</span>
<span class="font-body-sm text-body-sm text-outline">Target</span>
</div>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-headline-md text-headline-md text-on-surface">$80</span>
<div class="flex items-center gap-xs px-2 py-1 rounded-full bg-error-container/20">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="font-label-caps text-label-caps text-error">15 days left</span>
</div>
</div>
</div>
<!-- Card 4 -->
<div class="bg-surface-container-lowest rounded-lg border border-[#F1F5F9] ambient-shadow hover-lift transition-all-200 p-md flex items-center justify-between cursor-pointer opacity-75">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">headphones</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface line-through text-outline">Sony Headphones</span>
<span class="font-body-sm text-body-sm text-outline">Walmart</span>
</div>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-headline-md text-headline-md text-outline">$250</span>
<div class="flex items-center gap-xs px-2 py-1 rounded-full bg-surface-container-high">
<span class="w-2 h-2 rounded-full bg-outline"></span>
<span class="font-label-caps text-label-caps text-outline">Expired</span>
</div>
</div>
</div>
</div>
</main>
<!-- Floating Action Button (Desktop Only) -->
<button class="hidden md:flex fixed bottom-xl right-xl w-14 h-14 bg-primary-container text-on-primary rounded-full items-center justify-center shadow-lg hover:bg-primary transition-colors hover:scale-105 transform z-50">
<span class="material-symbols-outlined">add</span>
</button>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest dark:bg-inverse-surface shadow-[0px_-2px_4px_rgba(0,0,0,0.05)] flex justify-around items-center px-gutter py-sm pb-safe"><!-- Receipts -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-md py-xs transition-transform duration-200 active:scale-90 hover:opacity-80">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps mt-1">Receipts</span>
</button>
<!-- Warranties -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-sm transition-transform duration-200 active:scale-90 hover:opacity-80">
<span class="material-symbols-outlined">history</span>
<span class="font-label-caps text-label-caps mt-1">Warranties</span>
</button>
<!-- Add (Prominent Center Button) -->
<button class="flex flex-col items-center justify-center text-primary-container transition-transform duration-200 active:scale-90 hover:opacity-80 -mt-8 relative">
<div class="bg-surface-container-lowest dark:bg-inverse-surface p-2 rounded-full shadow-sm">
<div class="bg-primary-container text-on-primary rounded-full w-14 h-14 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
</div>
</button>
<!-- Alerts -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-sm transition-transform duration-200 active:scale-90 hover:opacity-80">
<span class="material-symbols-outlined">notifications</span>
<span class="font-label-caps text-label-caps mt-1">Alerts</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-sm transition-transform duration-200 active:scale-90 hover:opacity-80">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</button></nav>
